name: Sync Static Pages (No-Build)

on:
  schedule:
    # 北京时间每周一早上 5:00（即 UTC 时间每周日晚上 21:00）自动运行一次
    - cron: '0 21 * * 0'
  workflow_dispatch: # 保持手动触发按钮，方便随时测试

permissions:
  contents: write

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      # 第 1 步：拉取原作者编译好的静态分支，并重置为你的域名
      - name: Fetch Upstream Static Branch & Set Domain
        run: |
          # 采用 clone 方式更方便追踪文件改动
          git clone --branch gh-pages --single-branch https://github.com/Zephyruso/zashboard.git static-repo
          cd static-repo
          
          # 1. 删除原作者域名，写入自定义域名
          rm -f CNAME
          echo "zashboard.river-z.de" > CNAME
          
          # 配置 Git 机器人准备提交
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 记录修改
          git add -A
          git commit -m "chore: custom CNAME for fork deployment" || echo "No changes to commit"

      # 第 2 步：将静态代码推送到你自己的仓库分支
      - name: Push to My Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd static-repo
          # 强制推送到你自己的 gh-pages 分支
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:gh-pages --force
