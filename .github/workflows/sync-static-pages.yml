name: Sync Static Pages (No-Build)

on:
  schedule:
    # 北京时间每周一早上 5:00（即 UTC 时间每周日晚上 21:00）自动运行一次
    - cron: '0 21 * * 0'
  workflow_dispatch: # 保持手动触发按钮，方便随时测试

permissions:
  contents: write

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      # 第 1 步：拉取原作者编译好的静态分支
      - name: Fetch Upstream Static Branch
        run: |
          git init static-repo
          cd static-repo
          git remote add upstream https://github.com/Zephyruso/zashboard.git
          git fetch upstream gh-pages:upstream-target
          git checkout upstream-target

      # 第 2 步：将静态代码推送到你自己的仓库分支
      - name: Push to My Repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd static-repo
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git upstream-target:gh-pages --force
