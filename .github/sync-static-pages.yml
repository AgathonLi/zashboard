name: Sync Static Pages (No-Build)

on:
  schedule:
    # 设定每天北京时间早上 8:00 (UTC 00:00) 自动同步
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-gh-pages:
    runs-on: ubuntu-latest
    steps:
      # 第 1 步：强制拉取原作者编译好的静态分支
      - name: Fetch Upstream Static Branch
        run: |
          # 初始化一个临时的 git 目录
          git init static-repo
          cd static-repo
          
          # 添加原作者的仓库作为远程源
          git remote add upstream https://github.com/Zephyruso/zashboard.git
          
          # 🚨 核心：直接拉取原作者存放编译产物的 gh-pages 分支
          # 如果你想使用其他字体版本，可以把下方的 gh-pages 换成其他分支名（例如 gh-pages-no-fonts）
          git fetch upstream gh-pages:upstream-target
          
          git checkout upstream-target

      # 第 2 步：将静态代码强行推送到你自己的仓库分支
      - name: Push to My Repository
        env:
          # 使用 GitHub 提供的默认 Token，安全且有写入权限
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd static-repo
          
          # 强制推送到你自己仓库的 gh-pages 分支
          # 这会用原作者最新的编译结果完全覆盖你的对应分支
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git upstream-target:gh-pages --force
